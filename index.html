<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <main class="contenedor">

        <section class="formulario">

            <div class="encabezado">
                <h1>Contáctanos</h1>
                <p>Envíanos tu consulta y nos pondremos en contacto contigo.</p>
            </div>

            <form id="formularioContacto" novalidate>

                <div class="campo" id="grupo-nombre">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre y apellido"
                        maxlength="100" autocomplete="name" spellcheck="true" lang="es" required>
                    <span class="mensaje-error" id="error-nombre" aria-live="polite"></span>
                </div>

                <div class="campo" id="grupo-correo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" autocomplete="email"
                        spellcheck="false" required>
                    <span class="mensaje-error" id="error-correo" aria-live="polite"></span>
                </div>

                <div class="campo" id="grupo-descripcion">
                    <div class="label-fila">
                        <label for="descripcion">Descripción</label>
                        <span class="contador" id="contadorDescripcion">0 / 5000</span>
                    </div>
                    <textarea id="descripcion" name="descripcion" lang="es" spellcheck="true"
                        placeholder="Escribe aquí los detalles de tu mensaje..." maxlength="5000" required></textarea>
                    <span class="mensaje-error" id="error-descripcion" aria-live="polite"></span>

                    <!-- Panel de revisión ortográfica y tildes en tiempo real -->
                    <div class="panel-ortografia oculto" id="panelOrtografia" aria-live="polite">
                        <div class="ortografia-cabecera">
                            <span id="estadoOrtografia">Revisando ortografía y tildes...</span>
                        </div>
                        <ul class="lista-errores-ortografia" id="listaOrtografia"></ul>
                    </div>
                </div>

                <!-- Campo oculto antispam -->
                <div class="campo-oculto" aria-hidden="true">
                    <label for="website">No completar</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <button type="submit" id="btnEnviar">
                    Enviar mensaje
                </button>

            </form>

        </section>

    </main>

    <script src="assets/main.js"></script>

</body>

</html>
