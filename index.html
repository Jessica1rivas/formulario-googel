<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario de contacto</title>

    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <main class="contenedor">

        <section class="formulario">

            <div class="encabezado">
                <h1>Contáctanos</h1>
                <p>Envíanos un mensaje y nos pondremos en contacto contigo.</p>
            </div>

            <form id="formularioContacto">

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" maxlength="100"
                        required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" required>
                </div>

                <div class="campo">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo del mensaje" maxlength="150"
                        required>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje..." maxlength="5000"
                        required></textarea>
                </div>

                <!-- Campo oculto antispam -->
                <div class="campo-oculto" aria-hidden="true">
                    <label for="website">No completar</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <button type="submit" id="btnEnviar">
                    Enviar mensaje
                </button>

                <p id="estadoMensaje" role="status" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <script src="assets/main.js"></script>

</body>

</html>
